              class="h-full w-full bg-transparent text-center text-4xl font-bold text-[#ffcc00] caret-transparent outline-none sm:text-5xl" />
          </div>
          <div class="relative h-20 min-w-0 flex-1 rounded-md bg-[linear-gradient(180deg,#2e2e2e_0_50%,#1f1f1f_50%_100%)] shadow-[inset_0_1px_0_rgba(255,255,255,.08),0_3px_0_#000] transition after:pointer-events-none after:absolute after:inset-x-0 after:top-1/2 after:h-[2px] after:-translate-y-1/2 after:bg-black has-[input:focus]:ring-2 has-[input:focus]:ring-[#ffcc00] sm:h-24">
            <label for="split-flap-d3" class="sr-only">Digit 3</label>

              class="h-full w-full bg-transparent text-center text-4xl font-bold text-[#ffcc00] caret-transparent outline-none sm:text-5xl" />
          </div>
          <div class="relative h-20 min-w-0 flex-1 rounded-md bg-[linear-gradient(180deg,#2e2e2e_0_50%,#1f1f1f_50%_100%)] shadow-[inset_0_1px_0_rgba(255,255,255,.08),0_3px_0_#000] transition after:pointer-events-none after:absolute after:inset-x-0 after:top-1/2 after:h-[2px] after:-translate-y-1/2 after:bg-black has-[input:focus]:ring-2 has-[input:focus]:ring-[#ffcc00] sm:h-24">
            <label for="split-flap-d4" class="sr-only">Digit 4</label>
            <input id="split-flap-d4" data-otp-box type="text" inputmode="numeric" maxlength="1" pattern="[0-9]*" required
              class="h-full w-full bg-transparent text-center text-4xl font-bold text-[#ffcc00] caret-transparent outline-none sm:text-5xl" />
          </div>
          <div class="relative h-20 min-w-0 flex-1 rounded-md bg-[linear-gradient(180deg,#2e2e2e_0_50%,#1f1f1f_50%_100%)] shadow-[inset_0_1px_0_rgba(255,255,255,.08),0_3px_0_#000] transition after:pointer-events-none after:absolute after:inset-x-0 after:top-1/2 after:h-[2px] after:-translate-y-1/2 after:bg-black has-[input:focus]:ring-2 has-[input:focus]:ring-[#ffcc00] sm:h-24">
            <label for="split-flap-d5" class="sr-only">Digit 5</label>
            <input id="split-flap-d5" data-otp-box type="text" inputmode="numeric" maxlength="1" pattern="[0-9]*" required
