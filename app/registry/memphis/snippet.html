  <svg aria-hidden="true" class="absolute right-[6%] bottom-[8%] -z-10 w-36 rotate-12 sm:w-48" viewBox="0 0 220 40" fill="none"><path d="M5 20c15-20 30 20 45 0s30 20 45 0 30 20 45 0 30 20 45 0" stroke="#1a1a2e" stroke-width="7" stroke-linecap="round"/></svg>

  <svg aria-hidden="true" class="absolute bottom-[6%] left-[22%] -z-10 hidden w-24 lg:block" viewBox="0 0 100 30"><path d="M5 25 25 5l20 20L65 5l20 20" fill="none" stroke="#ff6b6b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>

  <div class="relative w-full max-w-md">
    <span aria-hidden="true" class="absolute -top-5 -left-3 z-10 -rotate-6 rounded-full border-[3px] border-[#1a1a2e] bg-[#3bceac] px-4 py-1 text-sm font-semibold shadow-[3px_3px_0_#1a1a2e]">it's free!</span>
    <form data-auth-form class="rounded-[32px] border-[3px] border-[#1a1a2e] bg-white p-7 shadow-[10px_10px_0_#1a1a2e] sm:px-10 sm:py-9">

        <svg aria-hidden="true" class="size-8" viewBox="0 0 32 32"><circle cx="16" cy="16" r="14" fill="#ffd23f" stroke="#1a1a2e" stroke-width="3"/><path d="M9 17c2 3 4 3 7 0s5-3 7 0" stroke="#1a1a2e" stroke-width="3" fill="none" stroke-linecap="round"/></svg>
        wiggle
      </a>
      <h1 class="mt-5 text-4xl leading-none font-bold sm:text-5xl">Join the<br /><span class="relative inline-block">fun club<svg aria-hidden="true" class="absolute -bottom-2 left-0 w-full" viewBox="0 0 200 14" preserveAspectRatio="none" fill="none"><path d="M3 9c30-8 60 6 97-2s67-4 97 1" stroke="#ff6b6b" stroke-width="6" stroke-linecap="round"/></svg></span></h1>
      <p class="mt-5 text-lg text-[#4a4a68]">Tiny daily habits, big happy streaks. Make an account in 10 seconds flat.</p>

      <div class="mt-6 flex flex-col gap-3.5">
        <div class="flex flex-col gap-1.5">
          <label for="memphis-name" class="text-base font-semibold">What should we call you?</label>
          <input id="memphis-name" name="name" type="text" autocomplete="nickname" required placeholder="Sunny" class="rounded-2xl border-[3px] border-[#1a1a2e] bg-[#fff7e0] px-4 py-3 text-lg outline-none transition placeholder:text-[#1a1a2e]/35 focus:bg-white focus:shadow-[4px_4px_0_#9b5de5]" />
        </div>
        <div class="flex flex-col gap-1.5">
          <label for="memphis-email" class="text-base font-semibold">Email</label>
          <input id="memphis-email" name="email" type="email" autocomplete="email" required placeholder="sunny@hello.fun" class="rounded-2xl border-[3px] border-[#1a1a2e] bg-[#fff7e0] px-4 py-3 text-lg outline-none transition placeholder:text-[#1a1a2e]/35 focus:bg-white focus:shadow-[4px_4px_0_#9b5de5]" />
        </div>
        <div class="flex flex-col gap-1.5">
          <label for="memphis-password" class="text-base font-semibold">Secret password</label>
          <input id="memphis-password" name="password" type="password" autocomplete="new-password" required minlength="8" placeholder="8+ characters" class="rounded-2xl border-[3px] border-[#1a1a2e] bg-[#fff7e0] px-4 py-3 text-lg outline-none transition placeholder:text-[#1a1a2e]/35 focus:bg-white focus:shadow-[4px_4px_0_#9b5de5]" />
        </div>
      </div>

      <button type="submit" class="mt-6 w-full cursor-pointer rounded-full border-[3px] border-[#1a1a2e] bg-[#ffd23f] px-6 py-3.5 text-xl font-bold shadow-[5px_5px_0_#1a1a2e] transition duration-150 ease-[cubic-bezier(.34,1.56,.64,1)] hover:-translate-y-1 hover:-rotate-1 hover:shadow-[7px_9px_0_#1a1a2e] focus-visible:outline-[3px] focus-visible:outline-offset-4 focus-visible:outline-[#9b5de5] active:translate-x-1 active:translate-y-1 active:rotate-0 active:shadow-[1px_1px_0_#1a1a2e] disabled:cursor-wait disabled:opacity-80">Let's go! &#10022;</button>
