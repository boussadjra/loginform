<section class="flex min-h-screen items-center justify-center bg-[#efeee9] px-3 py-6 font-['Geist',sans-serif] text-[#16161a] sm:px-6">
  <div class="grid w-full max-w-6xl grid-cols-2 gap-3 lg:grid-cols-4 lg:grid-rows-[auto_1fr_auto]">
    <div class="flex flex-col rounded-[28px] bg-white p-6 shadow-[0_1px_0_rgba(0,0,0,0.04)] sm:p-10 col-span-2 lg:row-span-3">
      <div class="flex items-center gap-2">
        <span aria-hidden="true" class="grid size-8 place-items-center rounded-[10px] bg-[#16161a]">
          <svg viewBox="0 0 24 24" class="size-4" fill="none" stroke="#d4f36b" stroke-width="3" stroke-linecap="round"><path d="M5 7h14M5 12h9M5 17h5"/></svg>
        </span>
        <span class="text-lg font-semibold tracking-tight">Tidy</span>
      </div>

      <div class="my-auto pt-10 lg:pt-6">
        <h1 class="text-4xl font-semibold tracking-[-0.04em] sm:text-5xl">Sign in to Tidy</h1>
        <p class="mt-2 text-[15px] text-[#6b6b73]">Your roadmap, docs and sprints in one calm place.</p>

        <form data-auth-form class="mt-8 space-y-4">
          <div>
            <label for="bento-email" class="mb-1.5 block text-sm font-medium">Work email</label>
            <input id="bento-email" name="email" type="email" autocomplete="email" inputmode="email" required placeholder="alex@company.com"
              class="block w-full rounded-2xl border border-[#e4e3de] bg-[#f7f7f4] px-4 py-3 text-[15px] outline-none transition placeholder:text-[#a3a3ab] focus:border-[#16161a] focus:bg-white focus:ring-4 focus:ring-[#d4f36b]" />
          </div>
          <div>
            <div class="mb-1.5 flex items-center justify-between">
              <label for="bento-password" class="text-sm font-medium">Password</label>
              <a href="#" class="text-sm font-medium text-[#6b6b73] hover:text-[#16161a] focus-visible:rounded focus-visible:outline-2 focus-visible:outline-[#16161a]">Forgot password?</a>
            </div>
            <div class="relative">
              <input id="bento-password" name="password" type="password" autocomplete="current-password" required placeholder="At least 8 characters"
                class="block w-full rounded-2xl border border-[#e4e3de] bg-[#f7f7f4] py-3 pr-16 pl-4 text-[15px] outline-none transition placeholder:text-[#a3a3ab] focus:border-[#16161a] focus:bg-white focus:ring-4 focus:ring-[#d4f36b]" />
              <button type="button" data-toggle-password aria-controls="bento-password" aria-pressed="false" aria-label="Show password" data-show="Show" data-hide="Hide"
                class="absolute top-1/2 right-2 -translate-y-1/2 rounded-xl px-2.5 py-1.5 text-xs font-semibold text-[#6b6b73] hover:bg-[#efeee9] hover:text-[#16161a] focus-visible:outline-2 focus-visible:outline-[#16161a]">Show</button>
            </div>
          </div>
          <button type="submit" data-pending="Signing in…" data-done="Welcome back"
            class="w-full rounded-2xl bg-[#16161a] px-4 py-3.5 text-[15px] font-semibold text-white transition hover:bg-[#2b2b31] focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#16161a] disabled:cursor-wait disabled:opacity-80">
            <span data-label>Continue</span>
          </button>
        </form>

        <div class="mt-4 grid grid-cols-2 gap-3">
          <button type="button" class="flex items-center justify-center gap-2 rounded-2xl border border-[#e4e3de] py-3 text-sm font-medium transition hover:bg-[#f7f7f4] focus-visible:outline-2 focus-visible:outline-[#16161a]">
            <svg aria-hidden="true" viewBox="0 0 24 24" class="size-4"><path fill="#4285F4" d="M21.6 12.2c0-.7-.1-1.3-.2-1.9H12v3.6h5.4a4.6 4.6 0 0 1-2 3v2.5h3.2c1.9-1.7 3-4.3 3-7.2Z"/><path fill="#34A853" d="M12 22c2.7 0 5-.9 6.6-2.4l-3.2-2.5c-.9.6-2 1-3.4 1-2.6 0-4.8-1.8-5.6-4.1H3.1v2.6A10 10 0 0 0 12 22Z"/><path fill="#FBBC05" d="M6.4 14a6 6 0 0 1 0-3.9V7.5H3.1a10 10 0 0 0 0 9Z"/><path fill="#EA4335" d="M12 5.9c1.5 0 2.8.5 3.8 1.5l2.9-2.9A10 10 0 0 0 3.1 7.5L6.4 10C7.2 7.7 9.4 5.9 12 5.9Z"/></svg>
            Google
          </button>
          <button type="button" class="flex items-center justify-center gap-2 rounded-2xl border border-[#e4e3de] py-3 text-sm font-medium transition hover:bg-[#f7f7f4] focus-visible:outline-2 focus-visible:outline-[#16161a]">
            <svg aria-hidden="true" viewBox="0 0 24 24" class="size-4"><path fill="#f25022" d="M3 3h8.5v8.5H3z"/><path fill="#7fba00" d="M12.5 3H21v8.5h-8.5z"/><path fill="#00a4ef" d="M3 12.5h8.5V21H3z"/><path fill="#ffb900" d="M12.5 12.5H21V21h-8.5z"/></svg>
            Microsoft
          </button>
        </div>
      </div>

      <p class="pt-8 text-sm text-[#6b6b73]">New to Tidy? <a href="#" class="font-semibold text-[#16161a] underline decoration-[#d4f36b] decoration-[3px] underline-offset-4 hover:decoration-[#16161a] focus-visible:rounded focus-visible:outline-2 focus-visible:outline-[#16161a]">Create a free workspace</a></p>
    </div>

    <div class="flex flex-col justify-between rounded-[28px] bg-[#16161a] p-5 text-white sm:p-6">
      <p class="text-sm text-white/60">Teams shipping on Tidy</p>
      <p class="mt-6 text-4xl font-semibold sm:text-5xl tracking-[-0.05em]">12.4k</p>
      <p class="mt-1 flex items-center gap-1.5 text-sm text-[#d4f36b]"><svg aria-hidden="true" viewBox="0 0 24 24" class="size-4" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 15l5-5 4 4 5-6"/></svg>+38% this quarter</p>
    </div>

    <div class="flex flex-col justify-between rounded-[28px] bg-[#ffb38a] p-5 sm:p-6">
      <svg aria-hidden="true" viewBox="0 0 24 24" class="size-8" fill="none" stroke="#16161a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 5-3.4 8.6-7 10-3.6-1.4-7-5-7-10V6l7-3Z"/><path d="m9 12 2 2 4-4"/></svg>
      <div class="mt-6">
        <p class="text-lg font-semibold tracking-tight">SSO &amp; SOC 2</p>
        <p class="text-sm text-[#16161a]/70">Okta, Google &amp; SAML ready.</p>
      </div>
    </div>

    <div aria-hidden="true" class="relative min-h-44 overflow-hidden rounded-[28px] bg-[#c9b8ff] col-span-2">
      <div class="absolute top-6 left-6 w-44 rotate-[-4deg] rounded-2xl bg-white p-3 shadow-[0_10px_30px_-10px_rgba(22,22,26,0.35)]">
        <div class="flex items-center gap-2"><span class="size-3 rounded-full bg-[#d4f36b] ring-2 ring-[#16161a]"></span><span class="h-2 w-20 rounded-full bg-[#16161a]"></span></div>
        <div class="mt-3 space-y-1.5"><span class="block h-1.5 w-full rounded-full bg-[#e4e3de]"></span><span class="block h-1.5 w-4/5 rounded-full bg-[#e4e3de]"></span></div>
      </div>
      <div class="absolute top-16 -right-4 w-44 sm:top-12 sm:right-8 sm:w-48 rotate-[5deg] rounded-2xl bg-[#16161a] p-3 shadow-[0_10px_30px_-10px_rgba(22,22,26,0.5)]">
        <div class="flex gap-1.5"><span class="h-8 flex-1 rounded-lg bg-[#d4f36b]"></span><span class="h-8 flex-1 rounded-lg bg-[#ffb38a]"></span><span class="h-8 flex-1 rounded-lg bg-white/20"></span></div>
        <span class="mt-3 block h-1.5 w-2/3 rounded-full bg-white/30"></span>
      </div>
      <div class="absolute -bottom-10 left-1/3 size-32 rounded-full bg-[#d4f36b]"></div>
      <div class="absolute right-1/4 -bottom-6 size-20 rounded-[20px] bg-[#16161a] rotate-12"></div>
    </div>

    <figure class="flex flex-col justify-between rounded-[28px] bg-[#d4f36b] p-6 col-span-2">
      <blockquote class="text-lg leading-snug font-medium tracking-tight sm:text-xl">“We replaced three tools with Tidy and our Monday stand-up got 20 minutes shorter.”</blockquote>
      <figcaption class="mt-5 flex items-center gap-3">
        <span aria-hidden="true" class="grid size-10 place-items-center rounded-full bg-[#16161a] text-sm font-semibold text-[#d4f36b]">MO</span>
        <span class="text-sm"><span class="block font-semibold">Maya Okafor</span><span class="text-[#16161a]/65">Head of Product, Fieldnote</span></span>
      </figcaption>
    </figure>
  </div>
</section>
