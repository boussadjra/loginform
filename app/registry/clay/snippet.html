<section class="flex min-h-screen items-center justify-center bg-[#e3e8ef] px-4 py-8 font-['Nunito',sans-serif] text-[#4a5670]">
  <div class="w-full max-w-sm rounded-[2.5rem] bg-[#e3e8ef] px-7 py-9 shadow-[18px_18px_36px_#b8c1ce,-18px_-18px_36px_#ffffff] sm:px-10">
    <div class="mx-auto grid size-20 place-items-center rounded-full bg-[#e3e8ef] shadow-[8px_8px_16px_#b8c1ce,-8px_-8px_16px_#ffffff]">
      <div class="grid size-14 place-items-center rounded-full bg-[#e3e8ef] shadow-[inset_5px_5px_10px_#b8c1ce,inset_-5px_-5px_10px_#ffffff]">
        <svg aria-hidden="true" viewBox="0 0 24 24" class="size-7 text-[#7286d3]" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a5 5 0 1 1 .9-9.9A6 6 0 0 1 19 10a4 4 0 0 1-1 7.9H7Z"/></svg>
      </div>
    </div>

    <h1 class="mt-6 text-center text-2xl font-bold tracking-tight text-[#3b4660]">Hello again</h1>
    <p class="mt-1 text-center text-sm text-[#7a86a0]">Sign in to your Nimbus space</p>

    <form data-auth-form class="mt-7 space-y-5">
      <div>
        <label for="clay-email" class="mb-2 ml-4 block text-xs font-bold tracking-wide text-[#7a86a0]">Email</label>
        <div class="flex items-center gap-3 rounded-full bg-[#e3e8ef] px-5 shadow-[inset_6px_6px_12px_#b8c1ce,inset_-6px_-6px_12px_#ffffff] transition focus-within:shadow-[inset_8px_8px_14px_#b0bac8,inset_-8px_-8px_14px_#ffffff]">
          <svg aria-hidden="true" viewBox="0 0 24 24" class="size-[18px] shrink-0 text-[#9aa5bc]" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></svg>
          <input id="clay-email" name="email" type="email" autocomplete="email" inputmode="email" required placeholder="hana@nimbus.app"
            class="min-w-0 flex-1 bg-transparent py-3.5 text-sm font-semibold text-[#3b4660] outline-none placeholder:font-medium placeholder:text-[#a3adc2]" />
        </div>
      </div>
      <div>
        <label for="clay-password" class="mb-2 ml-4 block text-xs font-bold tracking-wide text-[#7a86a0]">Password</label>
        <div class="flex items-center gap-3 rounded-full bg-[#e3e8ef] pr-1.5 pl-5 shadow-[inset_6px_6px_12px_#b8c1ce,inset_-6px_-6px_12px_#ffffff] transition focus-within:shadow-[inset_8px_8px_14px_#b0bac8,inset_-8px_-8px_14px_#ffffff]">
          <svg aria-hidden="true" viewBox="0 0 24 24" class="size-[18px] shrink-0 text-[#9aa5bc]" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
          <input id="clay-password" name="password" type="password" autocomplete="current-password" required placeholder="Your password"
            class="min-w-0 flex-1 bg-transparent py-3.5 text-sm font-semibold text-[#3b4660] outline-none placeholder:font-medium placeholder:text-[#a3adc2]" />
          <button type="button" data-toggle-password aria-controls="clay-password" aria-pressed="false" aria-label="Show password"
            class="group grid size-9 shrink-0 place-items-center rounded-full bg-[#e3e8ef] text-[#8490aa] shadow-[3px_3px_6px_#b8c1ce,-3px_-3px_6px_#ffffff] transition hover:text-[#7286d3] focus-visible:outline-2 focus-visible:outline-[#7286d3] aria-pressed:text-[#7286d3] aria-pressed:shadow-[inset_3px_3px_6px_#b8c1ce,inset_-3px_-3px_6px_#ffffff]">
            <svg aria-hidden="true" viewBox="0 0 24 24" class="size-4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <div class="flex items-center justify-between px-1 pt-1">
        <label class="flex cursor-pointer items-center gap-3 text-xs font-bold text-[#7a86a0] select-none">
          <input type="checkbox" name="remember" class="peer sr-only" checked />
          <span aria-hidden="true" class="relative h-6 w-11 rounded-full bg-[#e3e8ef] shadow-[inset_3px_3px_6px_#b8c1ce,inset_-3px_-3px_6px_#ffffff] transition peer-checked:bg-[#c9d2f5] peer-focus-visible:outline-2 peer-focus-visible:outline-offset-2 peer-focus-visible:outline-[#7286d3] after:absolute after:top-1 after:left-1 after:size-4 after:rounded-full after:bg-[#e3e8ef] after:shadow-[2px_2px_4px_#a9b3c3,-1px_-1px_3px_#ffffff] after:transition-transform peer-checked:after:translate-x-5 peer-checked:after:bg-[#7286d3]"></span>
          Remember me
        </label>
        <a href="#" class="text-xs font-bold text-[#7286d3] hover:text-[#5467b8] focus-visible:rounded focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#7286d3]">Forgot password?</a>
      </div>

      <button type="submit" data-pending="Signing in…" data-done="Welcome back"
        class="mt-3 w-full rounded-full bg-[#e3e8ef] py-4 text-sm font-bold tracking-wide text-[#7286d3] shadow-[8px_8px_16px_#b8c1ce,-8px_-8px_16px_#ffffff] transition hover:text-[#5467b8] focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#7286d3] active:shadow-[inset_6px_6px_12px_#b8c1ce,inset_-6px_-6px_12px_#ffffff] disabled:cursor-wait disabled:shadow-[inset_6px_6px_12px_#b8c1ce,inset_-6px_-6px_12px_#ffffff]">
        <span data-label>Sign in</span>
      </button>
    </form>

    <p class="mt-7 text-center text-xs font-bold tracking-wide text-[#9aa5bc]">or continue with</p>
    <div class="mt-4 flex justify-center gap-5">
      <button type="button" aria-label="Continue with Google" class="grid size-12 place-items-center rounded-full bg-[#e3e8ef] shadow-[6px_6px_12px_#b8c1ce,-6px_-6px_12px_#ffffff] transition focus-visible:outline-2 focus-visible:outline-[#7286d3] active:shadow-[inset_4px_4px_8px_#b8c1ce,inset_-4px_-4px_8px_#ffffff]">
        <svg aria-hidden="true" viewBox="0 0 24 24" class="size-5"><path fill="#EA4335" d="M12 10.2v3.9h5.4c-.2 1.3-1.6 3.8-5.4 3.8-3.2 0-5.9-2.7-5.9-6s2.7-6 5.9-6c1.9 0 3.1.8 3.8 1.5l2.6-2.5C16.8 3.4 14.6 2.4 12 2.4 6.7 2.4 2.4 6.7 2.4 12s4.3 9.6 9.6 9.6c5.5 0 9.2-3.9 9.2-9.4 0-.6-.1-1.1-.2-1.6H12Z"/></svg>
      </button>
      <button type="button" aria-label="Continue with Apple" class="grid size-12 place-items-center rounded-full bg-[#e3e8ef] text-[#3b4660] shadow-[6px_6px_12px_#b8c1ce,-6px_-6px_12px_#ffffff] transition focus-visible:outline-2 focus-visible:outline-[#7286d3] active:shadow-[inset_4px_4px_8px_#b8c1ce,inset_-4px_-4px_8px_#ffffff]">
        <svg aria-hidden="true" viewBox="0 0 24 24" class="size-5" fill="currentColor"><path d="M16.4 12.6c0-2.6 2.1-3.8 2.2-3.9-1.2-1.8-3.1-2-3.7-2-1.6-.2-3.1.9-3.9.9-.8 0-2-.9-3.4-.9-1.7 0-3.3 1-4.2 2.6-1.8 3.1-.5 7.7 1.3 10.2.9 1.2 1.9 2.6 3.2 2.6 1.3-.1 1.8-.8 3.3-.8 1.6 0 2 .8 3.4.8 1.4 0 2.3-1.3 3.1-2.5 1-1.4 1.4-2.8 1.4-2.9 0 0-2.7-1-2.7-4.1ZM13.9 5c.7-.9 1.2-2 1-3.2-1 .1-2.2.7-3 1.5-.6.7-1.2 1.9-1 3.1 1.1.1 2.3-.6 3-1.4Z"/></svg>
      </button>
      <button type="button" aria-label="Continue with GitHub" class="grid size-12 place-items-center rounded-full bg-[#e3e8ef] text-[#3b4660] shadow-[6px_6px_12px_#b8c1ce,-6px_-6px_12px_#ffffff] transition focus-visible:outline-2 focus-visible:outline-[#7286d3] active:shadow-[inset_4px_4px_8px_#b8c1ce,inset_-4px_-4px_8px_#ffffff]">
        <svg aria-hidden="true" viewBox="0 0 24 24" class="size-5" fill="currentColor"><path d="M12 .5a11.5 11.5 0 0 0-3.6 22.4c.6.1.8-.3.8-.6v-2c-3.2.7-3.9-1.5-3.9-1.5-.5-1.3-1.3-1.7-1.3-1.7-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.7-1.6-2.6-.3-5.3-1.3-5.3-5.7 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.2 1.2a11 11 0 0 1 5.8 0c2.2-1.5 3.2-1.2 3.2-1.2.6 1.6.2 2.8.1 3.1.8.8 1.2 1.9 1.2 3.1 0 4.4-2.7 5.4-5.3 5.7.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A11.5 11.5 0 0 0 12 .5Z"/></svg>
      </button>
    </div>

    <p class="mt-7 text-center text-sm font-semibold text-[#7a86a0]">New here? <a href="#" class="font-bold text-[#7286d3] hover:text-[#5467b8] focus-visible:rounded focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#7286d3]">Create an account</a></p>
  </div>
</section>
