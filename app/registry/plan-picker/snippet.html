<section class="relative isolate flex min-h-screen items-center justify-center overflow-hidden bg-[#f6f7fb] px-4 py-12 font-['Inter',sans-serif] text-[#0f172a] sm:px-6">
  <div aria-hidden="true" class="absolute inset-x-0 top-0 -z-10 h-[420px] bg-[radial-gradient(60%_100%_at_50%_0%,rgba(79,70,229,0.16),transparent_70%)]"></div>
  <form data-plan-form class="w-full max-w-3xl">
    <div class="text-center">
      <a href="#" class="inline-flex items-center gap-2 text-sm font-semibold">
        <svg aria-hidden="true" class="size-7" viewBox="0 0 28 28"><rect width="28" height="28" rx="8" fill="#4f46e5"/><path d="M8 17c2.5-6 9.5-6 12 0" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round"/><circle cx="14" cy="11" r="2" fill="#c7d2fe"/></svg>
        Cadence
      </a>
      <h1 class="mt-6 text-3xl font-semibold tracking-tight sm:text-4xl">Choose a plan, then create your account</h1>
      <p class="mt-3 text-[#64748b]">Every plan starts with a 14-day trial. No card required.</p>
    </div>

    <fieldset class="mt-10 grid gap-5 sm:grid-cols-3 sm:gap-3">
      <legend class="sr-only">Plan</legend>
      <label class="group relative flex cursor-pointer flex-col rounded-2xl border border-[#e2e8f0] bg-white p-5 transition hover:border-[#c7d2fe] has-[:checked]:border-[#4f46e5] has-[:checked]:bg-[#f5f5ff] has-[:checked]:shadow-[0_0_0_3px_rgba(79,70,229,0.15)] has-[:focus-visible]:outline-2 has-[:focus-visible]:outline-offset-2 has-[:focus-visible]:outline-[#4f46e5]">
        <input type="radio" name="plan" value="Free" class="sr-only" />
        <span class="flex items-center justify-between">
          <span class="text-sm font-semibold">Free</span>
          <span class="size-5 rounded-full border border-[#cbd5e1] transition group-has-[:checked]:border-[6px] group-has-[:checked]:border-[#4f46e5]"></span>
        </span>
        <span class="mt-3 text-3xl font-semibold tracking-tight">$0</span>
        <span class="mt-1 text-sm text-[#64748b]">For personal projects. 3 boards, 1 member.</span>
      </label>
      <label class="group relative flex cursor-pointer flex-col rounded-2xl border border-[#e2e8f0] bg-white p-5 transition hover:border-[#c7d2fe] has-[:checked]:border-[#4f46e5] has-[:checked]:bg-[#f5f5ff] has-[:checked]:shadow-[0_0_0_3px_rgba(79,70,229,0.15)] has-[:focus-visible]:outline-2 has-[:focus-visible]:outline-offset-2 has-[:focus-visible]:outline-[#4f46e5]">
        <input type="radio" name="plan" value="Pro" checked class="sr-only" />
        <span class="absolute -top-2.5 left-5 rounded-full bg-[#4f46e5] px-2.5 py-0.5 text-[11px] font-semibold text-white">Most popular</span>
        <span class="flex items-center justify-between">
          <span class="text-sm font-semibold">Pro</span>
          <span class="size-5 rounded-full border border-[#cbd5e1] transition group-has-[:checked]:border-[6px] group-has-[:checked]:border-[#4f46e5]"></span>
        </span>
        <span class="mt-3 text-3xl font-semibold tracking-tight">$12<span class="text-sm font-normal text-[#64748b]"> / mo</span></span>
        <span class="mt-1 text-sm text-[#64748b]">Unlimited boards, automations and guests.</span>
      </label>
      <label class="group relative flex cursor-pointer flex-col rounded-2xl border border-[#e2e8f0] bg-white p-5 transition hover:border-[#c7d2fe] has-[:checked]:border-[#4f46e5] has-[:checked]:bg-[#f5f5ff] has-[:checked]:shadow-[0_0_0_3px_rgba(79,70,229,0.15)] has-[:focus-visible]:outline-2 has-[:focus-visible]:outline-offset-2 has-[:focus-visible]:outline-[#4f46e5]">
        <input type="radio" name="plan" value="Team" class="sr-only" />
        <span class="flex items-center justify-between">
          <span class="text-sm font-semibold">Team</span>
          <span class="size-5 rounded-full border border-[#cbd5e1] transition group-has-[:checked]:border-[6px] group-has-[:checked]:border-[#4f46e5]"></span>
        </span>
        <span class="mt-3 text-3xl font-semibold tracking-tight">$29<span class="text-sm font-normal text-[#64748b]"> / seat</span></span>
        <span class="mt-1 text-sm text-[#64748b]">SSO, audit log, admin roles and priority support.</span>
      </label>
    </fieldset>

    <div class="mx-auto mt-6 max-w-xl rounded-2xl border border-[#e2e8f0] bg-white p-6 shadow-[0_1px_2px_rgba(15,23,42,0.04),0_12px_32px_-12px_rgba(15,23,42,0.12)] sm:p-8">
      <div class="grid gap-4 sm:grid-cols-2">
        <div class="flex flex-col gap-1.5">
          <label for="plan-picker-name" class="text-sm font-medium">Full name</label>
          <input id="plan-picker-name" name="name" type="text" autocomplete="name" required placeholder="Jordan Lee" class="rounded-lg border border-[#e2e8f0] px-3.5 py-2.5 text-sm outline-none transition placeholder:text-[#94a3b8] focus:border-[#4f46e5] focus:ring-4 focus:ring-[#4f46e5]/15" />
        </div>
        <div class="flex flex-col gap-1.5">
          <label for="plan-picker-email" class="text-sm font-medium">Work email</label>
          <input id="plan-picker-email" name="email" type="email" autocomplete="email" required placeholder="jordan@company.com" class="rounded-lg border border-[#e2e8f0] px-3.5 py-2.5 text-sm outline-none transition placeholder:text-[#94a3b8] focus:border-[#4f46e5] focus:ring-4 focus:ring-[#4f46e5]/15" />
        </div>
        <div class="flex flex-col gap-1.5 sm:col-span-2">
          <label for="plan-picker-password" class="text-sm font-medium">Password</label>
          <input id="plan-picker-password" name="password" type="password" autocomplete="new-password" required minlength="8" placeholder="8+ characters" class="rounded-lg border border-[#e2e8f0] px-3.5 py-2.5 text-sm outline-none transition placeholder:text-[#94a3b8] focus:border-[#4f46e5] focus:ring-4 focus:ring-[#4f46e5]/15" />
        </div>
      </div>
      <button type="submit" class="mt-6 w-full cursor-pointer rounded-lg bg-[#4f46e5] px-4 py-3 text-sm font-semibold text-white shadow-[0_1px_0_rgba(255,255,255,0.2)_inset,0_6px_16px_-6px_rgba(79,70,229,0.7)] transition hover:bg-[#4338ca] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#4f46e5] disabled:cursor-wait disabled:opacity-70">
        Start <span data-plan-label>Pro</span> trial
      </button>
      <p class="mt-4 text-center text-xs text-[#64748b]">By signing up you agree to the <a href="#" class="font-medium text-[#0f172a] underline underline-offset-2">Terms</a> and <a href="#" class="font-medium text-[#0f172a] underline underline-offset-2">Privacy Policy</a>.</p>
    </div>
    <p class="mt-6 text-center text-sm text-[#64748b]">Already on Cadence? <a href="#" class="font-semibold text-[#4f46e5] hover:underline">Sign in</a></p>
  </form>
</section>
