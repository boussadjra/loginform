<section class="flex min-h-screen items-center justify-center bg-[#ece8ff] bg-[radial-gradient(circle_at_15%_10%,#ffffff_0,transparent_40%),radial-gradient(circle_at_90%_90%,#d8d0ff_0,transparent_45%)] px-4 py-12 font-['DM_Sans',sans-serif] text-[#1d1b3a]">
  <div data-chat class="flex w-full max-w-[420px] flex-col overflow-hidden rounded-[28px] bg-[#f7f6ff] shadow-[0_30px_60px_-20px_rgba(49,36,160,.35),0_0_0_1px_rgba(91,75,255,.08)]">
    <header class="flex items-center gap-3 border-b border-[#e7e4fb] bg-white/80 px-5 py-4 backdrop-blur">
      <span aria-hidden="true" class="relative grid size-10 place-items-center rounded-full bg-[linear-gradient(135deg,#7a6bff,#5b4bff)] text-white shadow-[0_4px_10px_-2px_rgba(91,75,255,.5)]">
        <svg viewBox="0 0 24 24" class="size-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="7" width="16" height="12" rx="4"/><path d="M12 3v4M9 12h.01M15 12h.01M10 16h4"/></svg>
        <span class="absolute right-0 bottom-0 size-3 rounded-full border-2 border-white bg-[#22c55e]"></span>
      </span>
      <div class="min-w-0 flex-1">
        <h1 class="text-[15px] leading-tight font-semibold">Pip from Tandem</h1>
        <p class="text-xs text-[#6b6890]">Typically replies instantly</p>
      </div>
      <span class="rounded-full bg-[#ece8ff] px-2.5 py-1 text-[11px] font-semibold text-[#5b4bff]">Sign in</span>
    </header>

    <ol data-chat-log aria-live="polite" class="flex flex-col gap-2 px-4 pt-5 pb-3 sm:px-5">
      <li class="text-center text-[11px] font-medium tracking-wide text-[#9b98b8] uppercase">Today</li>
      <li class="max-w-[82%] self-start rounded-[20px] rounded-bl-md bg-white px-4 py-2.5 text-[15px] leading-snug shadow-[0_1px_2px_rgba(29,27,58,.06)]">Hey! 👋 Welcome back to Tandem.</li>
      <li class="max-w-[82%] self-start rounded-[20px] rounded-tl-md rounded-bl-md bg-white px-4 py-2.5 text-[15px] leading-snug shadow-[0_1px_2px_rgba(29,27,58,.06)]">How do you want to sign in today?</li>
      <li class="mt-2 self-end rounded-[20px] rounded-br-md bg-[#5b4bff] px-4 py-2.5 text-[15px] leading-snug text-white">Whatever’s fastest 🙂</li>
      <li class="max-w-[82%] self-start rounded-[20px] rounded-bl-md bg-white px-4 py-2.5 text-[15px] leading-snug shadow-[0_1px_2px_rgba(29,27,58,.06)]">Then pick one below, it takes one tap. No passwords here.</li>
      <li hidden data-chat-typing aria-label="Pip is typing" class="self-start rounded-[20px] rounded-bl-md bg-white px-4 py-3 shadow-[0_1px_2px_rgba(29,27,58,.06)]"><span class="flex gap-1"><span class="size-1.5 animate-bounce rounded-full bg-[#9b98b8]"></span><span class="size-1.5 animate-bounce rounded-full bg-[#9b98b8] [animation-delay:150ms]"></span><span class="size-1.5 animate-bounce rounded-full bg-[#9b98b8] [animation-delay:300ms]"></span></span></li>
    </ol>

    <div data-chat-chips role="group" aria-label="Sign-in options" class="flex flex-wrap justify-end gap-2 px-4 pb-4 sm:px-5">
      <button type="button" data-provider="Google" class="inline-flex cursor-pointer items-center gap-2 rounded-full border border-[#d9d4ff] bg-white py-2 pr-4 pl-2.5 text-sm font-medium text-[#1d1b3a] shadow-[0_1px_2px_rgba(29,27,58,.06)] transition hover:-translate-y-0.5 hover:border-[#5b4bff] hover:text-[#5b4bff] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#5b4bff]"><svg aria-hidden="true" viewBox="0 0 24 24" class="size-[18px]"><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5a5.6 5.6 0 0 1-2.4 3.6v3h3.9c2.3-2.1 3.5-5.2 3.5-8.8z"/><path fill="#34A853" d="M12 24c3.2 0 6-1.1 8-2.9l-3.9-3c-1.1.7-2.5 1.2-4.1 1.2-3.1 0-5.8-2.1-6.7-5H1.3v3.1A12 12 0 0 0 12 24z"/><path fill="#FBBC05" d="M5.3 14.3a7.2 7.2 0 0 1 0-4.6V6.6H1.3a12 12 0 0 0 0 10.8l4-3.1z"/><path fill="#EA4335" d="M12 4.8c1.8 0 3.3.6 4.6 1.8l3.4-3.4A12 12 0 0 0 1.3 6.6l4 3.1c.9-2.9 3.6-4.9 6.7-4.9z"/></svg>Google</button>
      <button type="button" data-provider="Apple" class="inline-flex cursor-pointer items-center gap-2 rounded-full border border-[#d9d4ff] bg-white py-2 pr-4 pl-2.5 text-sm font-medium text-[#1d1b3a] shadow-[0_1px_2px_rgba(29,27,58,.06)] transition hover:-translate-y-0.5 hover:border-[#5b4bff] hover:text-[#5b4bff] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#5b4bff]"><svg aria-hidden="true" viewBox="0 0 24 24" class="size-[18px]" fill="currentColor"><path d="M16.4 12.6c0-2.6 2.1-3.8 2.2-3.9-1.2-1.8-3.1-2-3.8-2-1.6-.2-3.1.9-3.9.9-.8 0-2-.9-3.4-.9-1.7 0-3.3 1-4.2 2.6-1.8 3.1-.5 7.7 1.3 10.2.9 1.2 1.9 2.6 3.2 2.6 1.3-.1 1.8-.8 3.3-.8 1.6 0 2 .8 3.4.8 1.4 0 2.3-1.3 3.1-2.5 1-1.4 1.4-2.8 1.4-2.9-.1 0-2.6-1-2.6-4.1zM13.9 5c.7-.9 1.2-2 1-3.2-1 0-2.3.7-3 1.6-.7.8-1.2 2-1.1 3.1 1.2.1 2.3-.6 3.1-1.5z"/></svg>Apple</button>
      <button type="button" data-provider="GitHub" class="inline-flex cursor-pointer items-center gap-2 rounded-full border border-[#d9d4ff] bg-white py-2 pr-4 pl-2.5 text-sm font-medium text-[#1d1b3a] shadow-[0_1px_2px_rgba(29,27,58,.06)] transition hover:-translate-y-0.5 hover:border-[#5b4bff] hover:text-[#5b4bff] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#5b4bff]"><svg aria-hidden="true" viewBox="0 0 24 24" class="size-[18px]" fill="currentColor"><path d="M12 .3a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2c-3.3.7-4-1.6-4-1.6-.6-1.4-1.4-1.8-1.4-1.8-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.8 1.3 3.5 1 0-.8.4-1.3.7-1.6-2.7-.3-5.5-1.3-5.5-6 0-1.2.5-2.3 1.3-3.1-.2-.4-.6-1.6 0-3.2 0 0 1-.3 3.4 1.2a11.5 11.5 0 0 1 6 0c2.3-1.5 3.3-1.2 3.3-1.2.6 1.6.2 2.8 0 3.2.9.8 1.3 1.9 1.3 3.2 0 4.6-2.8 5.6-5.5 5.9.5.4.9 1 .9 2.2v3.3c0 .3.1.7.8.6A12 12 0 0 0 12 .3"/></svg>GitHub</button>
      <button type="button" data-provider="Discord" class="inline-flex cursor-pointer items-center gap-2 rounded-full border border-[#d9d4ff] bg-white py-2 pr-4 pl-2.5 text-sm font-medium text-[#1d1b3a] shadow-[0_1px_2px_rgba(29,27,58,.06)] transition hover:-translate-y-0.5 hover:border-[#5b4bff] hover:text-[#5b4bff] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#5b4bff]"><svg aria-hidden="true" viewBox="0 0 24 24" class="size-[18px]" fill="#5865F2"><path d="M20.3 4.4A19.8 19.8 0 0 0 15.4 3l-.6 1.3a18.3 18.3 0 0 0-5.5 0L8.6 3a19.7 19.7 0 0 0-4.9 1.5C.6 9.1-.3 13.6.1 18.1a19.9 19.9 0 0 0 6 3l1.3-2.1c-.7-.3-1.4-.6-2-1l.5-.4a14.2 14.2 0 0 0 12.2 0l.5.4-2 1 1.3 2.1a19.8 19.8 0 0 0 6-3c.5-5.2-.9-9.7-3.6-13.7zM8 15.3c-1.2 0-2.2-1.1-2.2-2.4S6.8 10.5 8 10.5s2.2 1.1 2.2 2.4-1 2.4-2.2 2.4zm8 0c-1.2 0-2.2-1.1-2.2-2.4s1-2.4 2.2-2.4 2.2 1.1 2.2 2.4-1 2.4-2.2 2.4z"/></svg>Discord</button>
      <button type="button" data-provider="Microsoft" class="inline-flex cursor-pointer items-center gap-2 rounded-full border border-[#d9d4ff] bg-white py-2 pr-4 pl-2.5 text-sm font-medium text-[#1d1b3a] shadow-[0_1px_2px_rgba(29,27,58,.06)] transition hover:-translate-y-0.5 hover:border-[#5b4bff] hover:text-[#5b4bff] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#5b4bff]"><svg aria-hidden="true" viewBox="0 0 24 24" class="size-4"><rect x="1" y="1" width="10.5" height="10.5" fill="#F25022"/><rect x="12.5" y="1" width="10.5" height="10.5" fill="#7FBA00"/><rect x="1" y="12.5" width="10.5" height="10.5" fill="#00A4EF"/><rect x="12.5" y="12.5" width="10.5" height="10.5" fill="#FFB900"/></svg>Microsoft</button>
    </div>

    <form data-auth-form class="flex items-center gap-2 border-t border-[#e7e4fb] bg-white px-3 py-3">
      <label for="chat-email" class="sr-only">Or type your email</label>
      <input id="chat-email" name="email" type="email" autocomplete="email" inputmode="email" required placeholder="Or type your email…"
        class="h-11 min-w-0 flex-1 rounded-full bg-[#f3f1ff] px-4 text-[15px] outline-none placeholder:text-[#9b98b8] focus:bg-white focus:shadow-[0_0_0_2px_#5b4bff]" />
      <button type="submit" aria-label="Send" class="grid size-11 shrink-0 cursor-pointer place-items-center rounded-full bg-[#5b4bff] text-white transition hover:bg-[#4a3af0] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#5b4bff] disabled:opacity-60">
        <svg aria-hidden="true" viewBox="0 0 24 24" class="size-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </form>
  </div>
</section>
