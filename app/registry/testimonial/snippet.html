<section class="grid min-h-screen bg-[#fbf8f4] font-['Inter',sans-serif] text-[#2b2420] lg:grid-cols-[1.1fr_1fr]">
  <aside class="relative flex flex-col justify-between gap-12 overflow-hidden bg-[#e9e1d6] px-6 py-10 sm:px-12 lg:px-16 lg:py-14">
    <svg aria-hidden="true" class="absolute -top-10 -right-6 size-64 text-[#dcd1c3]" viewBox="0 0 100 100" fill="currentColor"><path d="M14 62c0-20 10-34 28-40l3 7c-10 5-15 12-15 21h13v26H14V62Zm40 0c0-20 10-34 28-40l3 7c-10 5-15 12-15 21h13v26H54V62Z"/></svg>
    <a href="#" class="relative flex items-center gap-2 font-['DM_Serif_Display',serif] text-2xl">
      <span aria-hidden="true" class="grid size-8 place-items-center rounded-full bg-[#2b2420] text-base text-[#fbf8f4]">q</span>
      Quire
    </a>
    <figure class="relative max-w-xl">
      <blockquote class="font-['DM_Serif_Display',serif] text-[27px] leading-[1.15] tracking-[-0.01em] sm:text-4xl xl:text-[44px]">
        &ldquo;We moved our whole editorial calendar into Quire in a weekend. Six months later, nobody on the team can remember <em class="text-[#c2562f]">how we shipped anything</em> before it.&rdquo;
      </blockquote>
      <figcaption class="mt-8 flex items-center gap-4">
        <span aria-hidden="true" class="grid size-12 place-items-center rounded-full bg-[#c2562f] text-sm font-semibold tracking-wide text-[#fbf8f4] ring-4 ring-[#fbf8f4]/60">PN</span>
        <span>
          <span class="block font-semibold">Priya Natarajan</span>
          <span class="block text-sm text-[#6f6259]">Head of Content, Fieldnote</span>
        </span>
      </figcaption>
    </figure>
    <div class="relative">
      <p class="text-xs font-medium tracking-[0.18em] text-[#8a7c71] uppercase">Trusted by 4,000+ writing teams</p>
      <ul class="mt-4 flex flex-wrap items-center gap-x-8 gap-y-3 text-[#6f6259]">
        <li class="flex items-center gap-1.5 font-semibold tracking-tight"><svg aria-hidden="true" class="size-4" viewBox="0 0 16 16" fill="currentColor"><path d="M8 1 15 8 8 15 1 8Z"/></svg>Fieldnote</li>
        <li class="font-['DM_Serif_Display',serif] text-lg italic">Harbor&amp;Co</li>
        <li class="flex items-center gap-1.5 text-sm font-bold tracking-[0.2em] uppercase"><svg aria-hidden="true" class="size-4" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="8" r="6"/></svg>Lumen</li>
        <li class="font-mono text-sm font-semibold">paperkite</li>
        <li class="flex items-center gap-1.5 font-semibold"><svg aria-hidden="true" class="size-4" viewBox="0 0 16 16" fill="currentColor"><path d="M2 14 8 2l6 12Z"/></svg>Alta</li>
      </ul>
    </div>
  </aside>

  <div class="flex items-center justify-center px-6 py-12 sm:px-12">
    <form data-auth-form class="w-full max-w-sm">
      <h1 class="font-['DM_Serif_Display',serif] text-4xl tracking-[-0.01em]">Start writing together</h1>
      <p class="mt-2 text-[#6f6259]">Free for teams up to five. Set up takes two minutes.</p>

      <button type="button" class="mt-8 flex w-full cursor-pointer items-center justify-center gap-3 rounded-full border border-[#e2d9cd] bg-white px-4 py-3 text-sm font-medium transition hover:border-[#2b2420] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#c2562f]">
        <svg aria-hidden="true" class="size-4" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5a5.6 5.6 0 0 1-2.4 3.6v3h3.9c2.2-2.1 3.5-5.1 3.5-8.8Z"/><path fill="#34A853" d="M12 24c3.2 0 6-1.1 7.9-2.9l-3.9-3c-1 .7-2.4 1.1-4 1.1-3.1 0-5.7-2.1-6.6-4.9h-4v3.1A12 12 0 0 0 12 24Z"/><path fill="#FBBC05" d="M5.4 14.3a7.2 7.2 0 0 1 0-4.6V6.6h-4a12 12 0 0 0 0 10.8l4-3.1Z"/><path fill="#EA4335" d="M12 4.8c1.7 0 3.3.6 4.5 1.8l3.4-3.4A12 12 0 0 0 1.4 6.6l4 3.1C6.3 6.9 8.9 4.8 12 4.8Z"/></svg>
        Continue with Google
      </button>
      <div class="my-6 flex items-center gap-4 text-xs text-[#8a7c71]"><span class="h-px flex-1 bg-[#e2d9cd]"></span>or with email<span class="h-px flex-1 bg-[#e2d9cd]"></span></div>

      <div class="flex flex-col gap-4">
        <div class="flex flex-col gap-1.5">
          <label for="testimonial-name" class="text-sm font-medium">Your name</label>
          <input id="testimonial-name" name="name" type="text" autocomplete="name" required placeholder="Priya Natarajan" class="rounded-xl border border-[#e2d9cd] bg-white px-4 py-3 text-sm outline-none transition placeholder:text-[#b3a69b] focus:border-[#2b2420] focus:ring-4 focus:ring-[#c2562f]/10" />
        </div>
        <div class="flex flex-col gap-1.5">
          <label for="testimonial-email" class="text-sm font-medium">Work email</label>
          <input id="testimonial-email" name="email" type="email" autocomplete="email" required placeholder="priya@fieldnote.co" class="rounded-xl border border-[#e2d9cd] bg-white px-4 py-3 text-sm outline-none transition placeholder:text-[#b3a69b] focus:border-[#2b2420] focus:ring-4 focus:ring-[#c2562f]/10" />
        </div>
        <div class="flex flex-col gap-1.5">
          <label for="testimonial-password" class="text-sm font-medium">Password</label>
          <input id="testimonial-password" name="password" type="password" autocomplete="new-password" required minlength="8" placeholder="8 characters or more" class="rounded-xl border border-[#e2d9cd] bg-white px-4 py-3 text-sm outline-none transition placeholder:text-[#b3a69b] focus:border-[#2b2420] focus:ring-4 focus:ring-[#c2562f]/10" />
        </div>
      </div>

      <button type="submit" class="mt-6 w-full cursor-pointer rounded-full bg-[#2b2420] px-4 py-3.5 text-sm font-semibold text-[#fbf8f4] transition hover:bg-[#c2562f] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#c2562f] disabled:cursor-wait disabled:opacity-70">Create free account</button>
      <p class="mt-6 text-center text-sm text-[#6f6259]">Already have an account? <a href="#" class="font-semibold text-[#2b2420] underline decoration-[#c2562f] underline-offset-4">Sign in</a></p>
    </form>
  </div>
</section>
