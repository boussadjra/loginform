<section class="flex min-h-screen items-center justify-center bg-white px-4 py-16 font-['Inter_Tight',sans-serif] text-[#0a0a0a] sm:px-6">
  <div class="w-full max-w-[400px]">
    <div class="mb-10 flex flex-col items-center text-center">
      <span aria-hidden="true" class="mb-6 grid size-11 place-items-center rounded-xl bg-[#0a0a0a] shadow-[0_1px_2px_rgba(0,0,0,.2),inset_0_1px_0_rgba(255,255,255,.15)]">
        <svg viewBox="0 0 24 24" class="size-5 text-white" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 19V5M5 19h14M9 15l3-4 3 2 4-6"/></svg>
      </span>
      <h1 class="text-[28px] leading-tight font-semibold tracking-[-0.02em]">Sign in to Ledgerly</h1>
      <p class="mt-2 text-[15px] text-[#737373]">Pick up where your books left off.</p>
    </div>

    <ul class="flex flex-col gap-2.5">
      <li class="relative">
        <button type="button" class="group flex h-12 w-full cursor-pointer items-center gap-3 rounded-xl border border-[#0a0a0a] bg-white px-4 text-[15px] font-medium shadow-[0_0_0_3px_rgba(37,99,235,.12)] transition hover:bg-[#fafafa] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#2563eb]">
          <svg aria-hidden="true" viewBox="0 0 24 24" class="size-5 shrink-0"><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5a5.6 5.6 0 0 1-2.4 3.6v3h3.9c2.3-2.1 3.5-5.2 3.5-8.8z"/><path fill="#34A853" d="M12 24c3.2 0 6-1.1 8-2.9l-3.9-3c-1.1.7-2.5 1.2-4.1 1.2-3.1 0-5.8-2.1-6.7-5H1.3v3.1A12 12 0 0 0 12 24z"/><path fill="#FBBC05" d="M5.3 14.3a7.2 7.2 0 0 1 0-4.6V6.6H1.3a12 12 0 0 0 0 10.8l4-3.1z"/><path fill="#EA4335" d="M12 4.8c1.8 0 3.3.6 4.6 1.8l3.4-3.4A12 12 0 0 0 1.3 6.6l4 3.1c.9-2.9 3.6-4.9 6.7-4.9z"/></svg>
          <span class="flex-1 text-left">Continue with Google</span>
          <span class="rounded-full bg-[#eff6ff] px-2 py-0.5 text-[11px] font-semibold tracking-wide text-[#2563eb] uppercase">Last used</span>
        </button>
      </li>
      <li>
        <button type="button" class="flex h-12 w-full cursor-pointer items-center gap-3 rounded-xl border border-[#e5e5e5] bg-white px-4 text-[15px] font-medium transition hover:border-[#d4d4d4] hover:bg-[#fafafa] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#2563eb]">
          <svg aria-hidden="true" viewBox="0 0 24 24" class="size-5 shrink-0" fill="#0a0a0a"><path d="M16.4 12.6c0-2.6 2.1-3.8 2.2-3.9-1.2-1.8-3.1-2-3.8-2-1.6-.2-3.1.9-3.9.9-.8 0-2-.9-3.4-.9-1.7 0-3.3 1-4.2 2.6-1.8 3.1-.5 7.7 1.3 10.2.9 1.2 1.9 2.6 3.2 2.6 1.3-.1 1.8-.8 3.3-.8 1.6 0 2 .8 3.4.8 1.4 0 2.3-1.3 3.1-2.5 1-1.4 1.4-2.8 1.4-2.9-.1 0-2.6-1-2.6-4.1zM13.9 5c.7-.9 1.2-2 1-3.2-1 0-2.3.7-3 1.6-.7.8-1.2 2-1.1 3.1 1.2.1 2.3-.6 3.1-1.5z"/></svg>
          <span class="flex-1 text-left">Continue with Apple</span>
        </button>
      </li>
      <li>
        <button type="button" class="flex h-12 w-full cursor-pointer items-center gap-3 rounded-xl border border-[#e5e5e5] bg-white px-4 text-[15px] font-medium transition hover:border-[#d4d4d4] hover:bg-[#fafafa] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#2563eb]">
          <svg aria-hidden="true" viewBox="0 0 24 24" class="size-5 shrink-0"><rect x="1" y="1" width="10.5" height="10.5" fill="#F25022"/><rect x="12.5" y="1" width="10.5" height="10.5" fill="#7FBA00"/><rect x="1" y="12.5" width="10.5" height="10.5" fill="#00A4EF"/><rect x="12.5" y="12.5" width="10.5" height="10.5" fill="#FFB900"/></svg>
          <span class="flex-1 text-left">Continue with Microsoft</span>
        </button>
      </li>
      <li>
        <button type="button" class="flex h-12 w-full cursor-pointer items-center gap-3 rounded-xl border border-[#e5e5e5] bg-white px-4 text-[15px] font-medium transition hover:border-[#d4d4d4] hover:bg-[#fafafa] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#2563eb]">
          <svg aria-hidden="true" viewBox="0 0 24 24" class="size-5 shrink-0" fill="#0a0a0a"><path d="M12 .3a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2c-3.3.7-4-1.6-4-1.6-.6-1.4-1.4-1.8-1.4-1.8-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.8 1.3 3.5 1 0-.8.4-1.3.7-1.6-2.7-.3-5.5-1.3-5.5-6 0-1.2.5-2.3 1.3-3.1-.2-.4-.6-1.6 0-3.2 0 0 1-.3 3.4 1.2a11.5 11.5 0 0 1 6 0c2.3-1.5 3.3-1.2 3.3-1.2.6 1.6.2 2.8 0 3.2.9.8 1.3 1.9 1.3 3.2 0 4.6-2.8 5.6-5.5 5.9.5.4.9 1 .9 2.2v3.3c0 .3.1.7.8.6A12 12 0 0 0 12 .3"/></svg>
          <span class="flex-1 text-left">Continue with GitHub</span>
        </button>
      </li>
      <li>
        <button type="button" class="flex h-12 w-full cursor-pointer items-center gap-3 rounded-xl border border-[#e5e5e5] bg-white px-4 text-[15px] font-medium transition hover:border-[#d4d4d4] hover:bg-[#fafafa] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#2563eb]">
          <svg aria-hidden="true" viewBox="0 0 24 24" class="size-5 shrink-0"><rect x="1" y="8.25" width="10" height="3.5" rx="1.75" fill="#36C5F0"/><rect x="12.25" y="1" width="3.5" height="10" rx="1.75" fill="#2EB67D"/><rect x="13" y="12.25" width="10" height="3.5" rx="1.75" fill="#ECB22E"/><rect x="8.25" y="13" width="3.5" height="10" rx="1.75" fill="#E01E5A"/><rect x="8.25" y="1" width="3.5" height="6" rx="1.75" fill="#36C5F0"/><rect x="17" y="8.25" width="6" height="3.5" rx="1.75" fill="#2EB67D"/><rect x="12.25" y="17" width="3.5" height="6" rx="1.75" fill="#ECB22E"/><rect x="1" y="12.25" width="6" height="3.5" rx="1.75" fill="#E01E5A"/></svg>
          <span class="flex-1 text-left">Continue with Slack</span>
        </button>
      </li>
    </ul>

    <div class="my-7 flex items-center gap-4 text-xs font-medium tracking-[0.12em] text-[#a3a3a3] uppercase">
      <span class="h-px flex-1 bg-[#e5e5e5]"></span>or<span class="h-px flex-1 bg-[#e5e5e5]"></span>
    </div>

    <form data-auth-form class="flex flex-col gap-2.5">
      <label for="provider-stack-email" class="sr-only">Work email</label>
      <input id="provider-stack-email" name="email" type="email" autocomplete="email" inputmode="email" required placeholder="name@company.com"
        class="h-12 rounded-xl border border-[#e5e5e5] bg-[#fafafa] px-4 text-[15px] outline-none placeholder:text-[#a3a3a3] focus:border-[#2563eb] focus:bg-white focus:shadow-[0_0_0_3px_rgba(37,99,235,.15)]" />
      <button type="submit" class="h-12 cursor-pointer rounded-xl bg-[#0a0a0a] text-[15px] font-medium text-white transition hover:bg-[#262626] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#2563eb] disabled:cursor-wait disabled:opacity-70">Continue with email</button>
    </form>

    <p class="mt-8 text-center text-[13px] text-[#737373]">New to Ledgerly? <a href="#" class="font-medium text-[#0a0a0a] underline decoration-[#d4d4d4] underline-offset-4 hover:decoration-[#0a0a0a]">Create an account</a></p>
  </div>
</section>
