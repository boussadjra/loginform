<section class="relative isolate flex min-h-screen items-center justify-center overflow-hidden bg-[#070b1f] px-4 py-16 font-['Plus_Jakarta_Sans',sans-serif] text-white">
  <div aria-hidden="true" class="absolute inset-0 -z-10">
    <div class="absolute -top-32 -left-24 size-[28rem] rounded-full bg-[#7c3aed] opacity-70 blur-[110px] sm:size-[36rem]"></div>
    <div class="absolute top-1/3 -right-40 size-[26rem] animate-pulse rounded-full bg-[#14b8a6] opacity-60 blur-[110px] sm:size-[34rem]"></div>
    <div class="absolute -bottom-40 left-1/4 size-[24rem] rounded-full bg-[#ec4899] opacity-60 blur-[120px] sm:size-[30rem]"></div>
    <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,transparent_40%,#070b1f_100%)]"></div>
  </div>

  <div class="relative w-full max-w-[26rem]">
    <div class="relative rounded-[2rem] border border-white/20 border-t-white/40 border-l-white/30 bg-white/[0.07] p-7 shadow-[0_30px_80px_-20px_rgba(0,0,0,0.6),inset_0_1px_0_rgba(255,255,255,0.25)] backdrop-blur-2xl sm:p-10">
      <div class="flex items-center gap-2.5">
        <span aria-hidden="true" class="grid size-9 place-items-center rounded-xl bg-gradient-to-br from-[#a78bfa] via-[#f472b6] to-[#2dd4bf] shadow-[0_0_24px_rgba(167,139,250,0.6)]">
          <svg viewBox="0 0 24 24" class="size-5" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg>
        </span>
        <span class="text-lg font-semibold tracking-tight">Lumen</span>
      </div>

      <h1 class="mt-8 text-3xl font-semibold tracking-tight">Welcome back</h1>
      <p class="mt-2 text-sm text-white/65">Sign in to pick up where your team left off.</p>

      <form data-auth-form class="mt-8 space-y-4">
        <div>
          <label for="aurora-email" class="mb-2 block text-xs font-medium text-white/75">Email</label>
          <input id="aurora-email" name="email" type="email" autocomplete="email" inputmode="email" required placeholder="name@company.com"
            class="block w-full rounded-2xl border border-white/15 bg-white/[0.06] px-4 py-3 text-sm text-white placeholder:text-white/35 outline-none transition focus:border-white/40 focus:bg-white/10 focus:ring-4 focus:ring-[#a78bfa]/25" />
        </div>
        <div>
          <div class="mb-2 flex items-center justify-between">
            <label for="aurora-password" class="text-xs font-medium text-white/75">Password</label>
            <a href="#" class="text-xs font-medium text-[#c4b5fd] hover:text-white focus-visible:rounded focus-visible:outline-2 focus-visible:outline-[#c4b5fd]">Forgot password?</a>
          </div>
          <div class="relative">
            <input id="aurora-password" name="password" type="password" autocomplete="current-password" required placeholder="Enter your password"
              class="block w-full rounded-2xl border border-white/15 bg-white/[0.06] py-3 pr-12 pl-4 text-sm text-white placeholder:text-white/35 outline-none transition focus:border-white/40 focus:bg-white/10 focus:ring-4 focus:ring-[#a78bfa]/25" />
            <button type="button" data-toggle-password aria-controls="aurora-password" aria-pressed="false" aria-label="Show password"
              class="group absolute top-1/2 right-2 grid size-9 -translate-y-1/2 place-items-center rounded-xl text-white/60 transition hover:bg-white/10 hover:text-white focus-visible:outline-2 focus-visible:outline-[#c4b5fd]">
              <svg aria-hidden="true" viewBox="0 0 24 24" class="size-[18px] group-aria-pressed:hidden" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg aria-hidden="true" viewBox="0 0 24 24" class="hidden size-[18px] group-aria-pressed:block" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18M10.6 5.1A9.7 9.7 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4M6.6 6.6A17 17 0 0 0 2 12s3.6 7 10 7a9.6 9.6 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
            </button>
          </div>
        </div>

        <label class="flex cursor-pointer items-center gap-2.5 pt-1 text-sm text-white/70 select-none">
          <input type="checkbox" name="remember" class="size-4 rounded border-white/30 bg-white/10 accent-[#a78bfa]" />
          Keep me signed in
        </label>

        <button type="submit" data-pending="Signing in…" data-done="Welcome back ✦"
          class="relative w-full overflow-hidden rounded-2xl bg-gradient-to-r from-[#8b5cf6] via-[#ec4899] to-[#14b8a6] px-4 py-3.5 text-sm font-semibold shadow-[0_10px_30px_-8px_rgba(236,72,153,0.7)] transition hover:brightness-110 focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-white disabled:cursor-wait disabled:opacity-80">
          <span data-label>Sign in</span>
        </button>
      </form>

      <div class="my-6 flex items-center gap-3 text-[11px] tracking-widest text-white/45 uppercase" aria-hidden="true">
        <span class="h-px flex-1 bg-gradient-to-r from-transparent to-white/25"></span>or<span class="h-px flex-1 bg-gradient-to-l from-transparent to-white/25"></span>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <button type="button" class="flex items-center justify-center gap-2 rounded-2xl border border-white/15 bg-white/[0.06] py-2.5 text-sm font-medium transition hover:bg-white/15 focus-visible:outline-2 focus-visible:outline-[#c4b5fd]">
          <svg aria-hidden="true" viewBox="0 0 24 24" class="size-4"><path fill="#fff" d="M12 10.2v3.9h5.4c-.2 1.3-1.6 3.8-5.4 3.8-3.2 0-5.9-2.7-5.9-6s2.7-6 5.9-6c1.9 0 3.1.8 3.8 1.5l2.6-2.5C16.8 3.4 14.6 2.4 12 2.4 6.7 2.4 2.4 6.7 2.4 12s4.3 9.6 9.6 9.6c5.5 0 9.2-3.9 9.2-9.4 0-.6-.1-1.1-.2-1.6H12Z"/></svg>
          Google
        </button>
        <button type="button" class="flex items-center justify-center gap-2 rounded-2xl border border-white/15 bg-white/[0.06] py-2.5 text-sm font-medium transition hover:bg-white/15 focus-visible:outline-2 focus-visible:outline-[#c4b5fd]">
          <svg aria-hidden="true" viewBox="0 0 24 24" class="size-4" fill="currentColor"><path d="M16.4 12.6c0-2.6 2.1-3.8 2.2-3.9-1.2-1.8-3.1-2-3.7-2-1.6-.2-3.1.9-3.9.9-.8 0-2-.9-3.4-.9-1.7 0-3.3 1-4.2 2.6-1.8 3.1-.5 7.7 1.3 10.2.9 1.2 1.9 2.6 3.2 2.6 1.3-.1 1.8-.8 3.3-.8 1.6 0 2 .8 3.4.8 1.4 0 2.3-1.3 3.1-2.5 1-1.4 1.4-2.8 1.4-2.9 0 0-2.7-1-2.7-4.1ZM13.9 5c.7-.9 1.2-2 1-3.2-1 .1-2.2.7-3 1.5-.6.7-1.2 1.9-1 3.1 1.1.1 2.3-.6 3-1.4Z"/></svg>
          Apple
        </button>
      </div>

      <p class="mt-8 text-center text-sm text-white/60">New to Lumen? <a href="#" class="font-semibold text-white underline decoration-white/30 underline-offset-4 hover:decoration-white focus-visible:rounded focus-visible:outline-2 focus-visible:outline-[#c4b5fd]">Create an account</a></p>
    </div>
  </div>
</section>
