          <label for="sms-d4" class="sr-only">Digit 4</label>
          <input id="sms-d4" data-otp-box type="text" inputmode="numeric" maxlength="1" pattern="[0-9]*" required

          <label for="sms-d5" class="sr-only">Digit 5</label>
          <input id="sms-d5" data-otp-box type="text" inputmode="numeric" maxlength="1" pattern="[0-9]*" required
            class="h-14 w-full min-w-0 flex-1 rounded-2xl bg-[#f2f2f7] text-center text-2xl font-semibold text-[#1c1c1e] caret-[#0a84ff] transition outline-none focus:bg-white focus:ring-2 focus:ring-[#0a84ff] focus:shadow-[0_0_0_6px_rgba(10,132,255,.15)]" />
          <label for="sms-d6" class="sr-only">Digit 6</label>

        </div>
      </fieldset>
      <p class="mt-3 text-center text-xs text-[#8e8e93]">Tip: tap the code in the message to fill it in.</p>

      <button type="submit" data-otp-submit

        Continue

      <div class="mt-4 flex justify-center gap-5 text-sm font-medium text-[#0a84ff]">
        <button type="button" class="cursor-pointer hover:underline focus-visible:rounded focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#0a84ff]">Resend text</button>
        <button type="button" class="cursor-pointer hover:underline focus-visible:rounded focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#0a84ff]">Change number</button>
