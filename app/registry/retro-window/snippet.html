<section class="relative isolate flex min-h-screen items-center justify-center overflow-hidden bg-[#008080] px-3 pt-10 pb-20 font-['Pixelify_Sans',sans-serif] text-black">
  <ul aria-hidden="true" class="absolute top-6 left-5 hidden flex-col gap-7 text-center text-[13px] text-white sm:flex">
    <li class="flex w-20 flex-col items-center gap-1">
      <svg viewBox="0 0 32 32" class="size-9" shape-rendering="crispEdges"><rect x="4" y="4" width="24" height="17" fill="#c0c0c0"/><rect x="6" y="6" width="20" height="13" fill="#000080"/><rect x="8" y="8" width="6" height="2" fill="#5ff"/><rect x="12" y="21" width="8" height="3" fill="#808080"/><rect x="7" y="24" width="18" height="4" fill="#c0c0c0"/><rect x="7" y="27" width="18" height="1" fill="#404040"/></svg>
      <span class="bg-[#008080] px-0.5">My Computer</span>
    </li>
    <li class="flex w-20 flex-col items-center gap-1">
      <svg viewBox="0 0 32 32" class="size-9" shape-rendering="crispEdges"><rect x="3" y="8" width="26" height="18" fill="#fff"/><rect x="3" y="8" width="26" height="18" fill="none" stroke="#000" stroke-width="1"/><path d="M3 8l13 10L29 8" fill="none" stroke="#000" stroke-width="1.5"/><rect x="22" y="4" width="8" height="8" fill="#ff0000"/><rect x="25" y="5" width="2" height="4" fill="#fff"/><rect x="25" y="10" width="2" height="1" fill="#fff"/></svg>
      <span class="bg-[#008080] px-0.5">Inbox</span>
    </li>
    <li class="flex w-20 flex-col items-center gap-1">
      <svg viewBox="0 0 32 32" class="size-9" shape-rendering="crispEdges"><rect x="9" y="4" width="14" height="3" fill="#808080"/><rect x="7" y="7" width="18" height="3" fill="#c0c0c0"/><rect x="9" y="10" width="14" height="18" fill="#dfdfdf"/><rect x="11" y="12" width="2" height="14" fill="#808080"/><rect x="15" y="12" width="2" height="14" fill="#808080"/><rect x="19" y="12" width="2" height="14" fill="#808080"/></svg>
      <span class="bg-[#008080] px-0.5">Recycle Bin</span>
    </li>
  </ul>

  <div class="w-full max-w-[26rem] bg-[#c0c0c0] p-[3px] shadow-[inset_-1px_-1px_#0a0a0a,inset_1px_1px_#dfdfdf,inset_-2px_-2px_#808080,inset_2px_2px_#ffffff,6px_6px_0_rgba(0,0,0,0.35)]">
    <div class="flex items-center gap-2 bg-gradient-to-r from-[#000080] to-[#1084d0] py-1 pr-1 pl-2 text-white">
      <svg aria-hidden="true" viewBox="0 0 16 16" class="size-4" shape-rendering="crispEdges"><rect x="1" y="6" width="7" height="5" fill="#ffd700"/><rect x="3" y="8" width="3" height="1" fill="#000"/><rect x="8" y="8" width="7" height="2" fill="#ffd700"/><rect x="12" y="10" width="1" height="2" fill="#ffd700"/><rect x="14" y="10" width="1" height="3" fill="#ffd700"/></svg>
      <h1 class="flex-1 truncate text-sm font-bold tracking-wide">Welcome to HomeNet</h1>
      <button type="button" aria-label="Help" class="grid h-[18px] w-5 place-items-center bg-[#c0c0c0] text-xs leading-none font-bold text-black shadow-[inset_-1px_-1px_#0a0a0a,inset_1px_1px_#ffffff,inset_-2px_-2px_#808080] focus-visible:outline-1 focus-visible:outline-dotted focus-visible:outline-black active:shadow-[inset_1px_1px_#0a0a0a,inset_-1px_-1px_#ffffff]">?</button>
      <button type="button" aria-label="Close" class="grid h-[18px] w-5 place-items-center bg-[#c0c0c0] text-black shadow-[inset_-1px_-1px_#0a0a0a,inset_1px_1px_#ffffff,inset_-2px_-2px_#808080] focus-visible:outline-1 focus-visible:outline-dotted focus-visible:outline-black active:shadow-[inset_1px_1px_#0a0a0a,inset_-1px_-1px_#ffffff]">
        <svg aria-hidden="true" viewBox="0 0 8 7" class="h-[7px] w-2" shape-rendering="crispEdges"><path fill="#000" d="M0 0h2v1h1v1h2V1h1V0h2v1H7v1H6v1H5v1h1v1h1v1h1v1H6V6H5V5H3v1H2v1H0V6h1V5h1V4h1V3H2V2H1V1H0z"/></svg>
      </button>
    </div>

    <div class="flex gap-4 px-4 pt-5 pb-4">
      <svg aria-hidden="true" viewBox="0 0 32 32" class="size-12 shrink-0" shape-rendering="crispEdges"><rect x="2" y="12" width="14" height="10" fill="#ffd700"/><rect x="2" y="12" width="14" height="1" fill="#fff5a0"/><rect x="5" y="15" width="6" height="4" fill="#8a6d00"/><rect x="16" y="15" width="14" height="4" fill="#ffd700"/><rect x="22" y="19" width="2" height="4" fill="#ffd700"/><rect x="27" y="19" width="2" height="6" fill="#ffd700"/><rect x="2" y="22" width="14" height="1" fill="#8a6d00"/></svg>
      <p class="text-[15px] leading-snug">Type your user name and password to log on to <strong class="font-bold">HomeNet</strong>.</p>
    </div>

    <form data-auth-form class="px-4 pb-4">
      <div class="grid grid-cols-[6.5rem_1fr] items-center gap-x-2 gap-y-3 text-[15px]">
        <label for="retro-window-user"><span class="underline">U</span>ser name:</label>
        <input id="retro-window-user" name="username" type="text" autocomplete="username" required spellcheck="false" accesskey="u"
          class="min-w-0 bg-white px-1.5 py-1 font-['Pixelify_Sans',sans-serif] text-[15px] outline-none shadow-[inset_-1px_-1px_#ffffff,inset_1px_1px_#808080,inset_-2px_-2px_#dfdfdf,inset_2px_2px_#0a0a0a] focus:outline-1 focus:outline-dotted focus:outline-offset-1 focus:outline-black" />
        <label for="retro-window-password"><span class="underline">P</span>assword:</label>
        <input id="retro-window-password" name="password" type="password" autocomplete="current-password" required accesskey="p"
          class="min-w-0 bg-white px-1.5 py-1 text-[15px] outline-none shadow-[inset_-1px_-1px_#ffffff,inset_1px_1px_#808080,inset_-2px_-2px_#dfdfdf,inset_2px_2px_#0a0a0a] focus:outline-1 focus:outline-dotted focus:outline-offset-1 focus:outline-black" />
      </div>

      <label class="mt-4 ml-[7rem] flex w-fit cursor-pointer items-center gap-2 text-[15px] select-none">
        <input type="checkbox" name="remember" class="peer sr-only" />
        <span aria-hidden="true" class="grid size-[13px] place-items-center bg-white shadow-[inset_-1px_-1px_#ffffff,inset_1px_1px_#808080,inset_-2px_-2px_#dfdfdf,inset_2px_2px_#0a0a0a] peer-focus-visible:outline-1 peer-focus-visible:outline-dotted peer-focus-visible:outline-black [&>svg]:invisible peer-checked:[&>svg]:visible">
          <svg viewBox="0 0 7 7" class="size-[7px]" shape-rendering="crispEdges"><path fill="#000" d="M6 0h1v2H6v1H5v1H4v1H3v1H2V5H1V4H0V2h1v1h1v1h1V3h1V2h1V1h1z"/></svg>
        </span>
        <span><span class="underline">R</span>emember me on this PC</span>
      </label>

      <div class="mt-5 flex flex-wrap justify-end gap-2">
        <button type="submit" data-pending="Wait…" data-done="Done!"
          class="min-w-[5.5rem] bg-[#c0c0c0] px-4 py-1.5 text-[15px] shadow-[inset_-1px_-1px_#0a0a0a,inset_1px_1px_#ffffff,inset_-2px_-2px_#808080,inset_2px_2px_#dfdfdf,0_0_0_1px_#000] focus-visible:outline-1 focus-visible:outline-dotted focus-visible:-outline-offset-4 focus-visible:outline-black active:shadow-[inset_1px_1px_#0a0a0a,inset_-1px_-1px_#ffffff,inset_2px_2px_#808080,0_0_0_1px_#000] disabled:cursor-wait disabled:text-[#808080]">
          <span data-label>OK</span>
        </button>
        <button type="reset"
          class="min-w-[5.5rem] bg-[#c0c0c0] px-4 py-1.5 text-[15px] shadow-[inset_-1px_-1px_#0a0a0a,inset_1px_1px_#ffffff,inset_-2px_-2px_#808080,inset_2px_2px_#dfdfdf] focus-visible:outline-1 focus-visible:outline-dotted focus-visible:-outline-offset-4 focus-visible:outline-black active:shadow-[inset_1px_1px_#0a0a0a,inset_-1px_-1px_#ffffff,inset_2px_2px_#808080]">
          Cancel
        </button>
      </div>

      <div class="mt-4 flex flex-wrap justify-between gap-x-4 gap-y-1 border-t border-t-[#808080] pt-3 text-[14px] shadow-[inset_0_1px_#ffffff]">
        <a href="#" class="text-[#000080] underline hover:text-[#1084d0] focus-visible:outline-1 focus-visible:outline-dotted focus-visible:outline-black">Forgot password?</a>
        <a href="#" class="text-[#000080] underline hover:text-[#1084d0] focus-visible:outline-1 focus-visible:outline-dotted focus-visible:outline-black">New user? Sign up…</a>
      </div>
    </form>
  </div>

  <div aria-hidden="true" class="absolute inset-x-0 bottom-0 flex h-10 items-center justify-between bg-[#c0c0c0] px-1 shadow-[inset_0_1px_#dfdfdf,inset_0_2px_#ffffff]">
    <span class="flex h-7 items-center gap-1.5 px-2 text-sm font-bold shadow-[inset_-1px_-1px_#0a0a0a,inset_1px_1px_#ffffff,inset_-2px_-2px_#808080,inset_2px_2px_#dfdfdf]">
      <svg viewBox="0 0 16 16" class="size-4" shape-rendering="crispEdges"><rect x="1" y="1" width="6" height="6" fill="#ff0000"/><rect x="9" y="1" width="6" height="6" fill="#00a000"/><rect x="1" y="9" width="6" height="6" fill="#0000ff"/><rect x="9" y="9" width="6" height="6" fill="#ffd700"/></svg>
      Start
    </span>
    <span class="flex h-7 items-center px-3 text-sm shadow-[inset_1px_1px_#808080,inset_-1px_-1px_#ffffff]">9:41 AM</span>
  </div>
</section>
