<section class="relative isolate flex min-h-screen items-center justify-center overflow-hidden bg-black px-4 py-12 font-['Geist',sans-serif] text-[#ededed]">
  <div aria-hidden="true" class="absolute inset-0 -z-10 bg-[radial-gradient(rgba(255,255,255,0.12)_1px,transparent_1px)] bg-[size:22px_22px] [mask-image:radial-gradient(ellipse_60%_60%_at_50%_45%,#000_30%,transparent_100%)]"></div>
  <div aria-hidden="true" class="absolute top-1/2 left-1/2 -z-10 h-72 w-[min(36rem,90vw)] -translate-x-1/2 -translate-y-1/2 rounded-full bg-[radial-gradient(closest-side,rgba(168,85,247,0.35),rgba(34,211,238,0.12),transparent)] blur-2xl"></div>

  <div class="w-full max-w-[400px]">
    <div class="mb-6 flex items-center justify-center gap-2 font-['Geist_Mono',monospace] text-sm">
      <svg aria-hidden="true" class="size-5" viewBox="0 0 20 20" fill="none"><path d="M3 5l5 5-5 5" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 15h7" stroke="#a855f7" stroke-width="2" stroke-linecap="round"/></svg>
      stackpipe
      <span class="rounded-full border border-white/15 px-2 py-0.5 text-[10px] text-white/50">v2.4</span>
    </div>

    <div class="rounded-2xl bg-[linear-gradient(140deg,rgba(168,85,247,0.9),rgba(255,255,255,0.08)_35%,rgba(255,255,255,0.08)_65%,rgba(34,211,238,0.9))] p-px shadow-[0_30px_80px_-20px_rgba(168,85,247,0.35)]">
      <form data-auth-form class="rounded-[15px] bg-[#0a0a0a] p-6 sm:p-8">
        <h1 class="text-xl font-semibold tracking-tight text-white">Create your account</h1>
        <p class="mt-1.5 text-sm text-[#a1a1a1]">Deploy your first pipeline in under a minute.</p>

        <button type="button" class="mt-6 flex w-full cursor-pointer items-center justify-center gap-2.5 rounded-lg bg-white px-4 py-2.5 text-sm font-medium text-black transition hover:bg-[#d4d4d4] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#a855f7]">
          <svg aria-hidden="true" class="size-4" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0a8 8 0 0 0-2.5 15.6c.4 0 .5-.2.5-.4v-1.5c-2.2.5-2.7-1-2.7-1-.4-.9-.9-1.2-.9-1.2-.7-.5.1-.5.1-.5.8.1 1.2.8 1.2.8.7 1.3 1.9.9 2.4.7 0-.5.3-.9.5-1.1-1.8-.2-3.6-.9-3.6-4 0-.9.3-1.6.8-2.1-.1-.2-.4-1 .1-2.1 0 0 .7-.2 2.2.8a7.4 7.4 0 0 1 4 0c1.5-1 2.2-.8 2.2-.8.4 1.1.2 1.9.1 2.1.5.6.8 1.3.8 2.1 0 3.1-1.9 3.7-3.6 3.9.3.3.6.8.6 1.5v2.2c0 .2.1.5.6.4A8 8 0 0 0 8 0Z"/></svg>
          Continue with GitHub
        </button>
        <button type="button" class="mt-2.5 flex w-full cursor-pointer items-center justify-center gap-2.5 rounded-lg border border-white/10 bg-white/[0.03] px-4 py-2.5 text-sm font-medium transition hover:bg-white/[0.07] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#a855f7]">
          <svg aria-hidden="true" class="size-4" viewBox="0 0 16 16" fill="#fc6d26"><path d="m15.7 6.3-.1-.2L13.5.6a.5.5 0 0 0-1 0l-1.4 4.3H4.9L3.5.6a.5.5 0 0 0-1 0L.4 6.1v.2a3.6 3.6 0 0 0 1.2 4.2l3.3 2.5 1.6 1.2 1 .7c.3.2.7.2 1 0l1-.7 1.6-1.2 3.3-2.5a3.6 3.6 0 0 0 1.3-4.2Z"/></svg>
          Continue with GitLab
        </button>

        <div class="my-6 flex items-center gap-3 font-['Geist_Mono',monospace] text-[11px] tracking-widest text-[#666] uppercase"><span class="h-px flex-1 bg-white/10"></span>or<span class="h-px flex-1 bg-white/10"></span></div>

        <div class="flex flex-col gap-3">
          <div>
            <label for="devtool-email" class="sr-only">Email</label>
            <input id="devtool-email" name="email" type="email" autocomplete="email" required placeholder="you@example.dev" class="w-full rounded-lg border border-white/10 bg-black px-3.5 py-2.5 text-sm text-white outline-none transition placeholder:text-[#555] focus:border-[#a855f7] focus:ring-4 focus:ring-[#a855f7]/20" />
          </div>
          <div>
            <label for="devtool-password" class="sr-only">Password</label>
            <input id="devtool-password" name="password" type="password" autocomplete="new-password" required minlength="8" placeholder="Password" class="w-full rounded-lg border border-white/10 bg-black px-3.5 py-2.5 text-sm text-white outline-none transition placeholder:text-[#555] focus:border-[#a855f7] focus:ring-4 focus:ring-[#a855f7]/20" />
          </div>
        </div>
        <button type="submit" class="mt-4 w-full cursor-pointer rounded-lg bg-[linear-gradient(90deg,#a855f7,#22d3ee)] px-4 py-2.5 text-sm font-semibold text-black transition hover:brightness-110 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#22d3ee] disabled:cursor-wait disabled:opacity-70">Create account</button>
        <p class="mt-5 text-center text-xs text-[#888]">By continuing you agree to our <a href="#" class="text-[#ededed] underline decoration-white/30 underline-offset-2 hover:decoration-white">Terms</a>.</p>
      </form>
    </div>

    <div class="mt-5 flex items-center justify-between gap-3 rounded-xl border border-white/10 bg-[#0a0a0a]/80 py-2 pr-2 pl-4 font-['Geist_Mono',monospace] text-[13px]">
      <code class="truncate"><span class="text-[#555] select-none">$ </span><span class="text-[#22d3ee]">npx</span> stackpipe<span class="text-[#a855f7]">@latest</span> init</code>
      <button type="button" data-copy="npx stackpipe@latest init" class="shrink-0 cursor-pointer rounded-md border border-white/10 px-2.5 py-1 text-[11px] text-[#a1a1a1] transition hover:bg-white/10 hover:text-white focus-visible:outline-2 focus-visible:outline-[#a855f7]">Copy</button>
    </div>
    <p class="mt-6 text-center text-sm text-[#888]">Have an account? <a href="#" class="text-white hover:underline">Log in &rarr;</a></p>
  </div>
</section>
