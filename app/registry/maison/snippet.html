<section class="relative isolate flex min-h-screen items-center justify-center overflow-hidden bg-[#0a0908] px-10 py-14 font-['Cormorant_Garamond',serif] text-[#efe6d2]">
  <div aria-hidden="true" class="absolute inset-4 -z-10 border border-[#c9a96e]/25 sm:inset-6"></div>
  <div aria-hidden="true" class="absolute inset-[22px] -z-10 border border-[#c9a96e]/10 sm:inset-[30px]"></div>

  <div class="grid w-full max-w-5xl items-center gap-16 lg:grid-cols-2">
    <div aria-hidden="true" class="relative mx-auto hidden h-[34rem] w-80 rounded-t-full border border-[#c9a96e]/60 p-3 lg:block">
      <div class="flex h-full flex-col items-center justify-center rounded-t-full border border-[#c9a96e]/30 bg-[radial-gradient(ellipse_at_50%_35%,rgba(201,169,110,0.22),transparent_65%)] px-8 text-center">
        <p class="text-[10px] tracking-[0.5em] text-[#c9a96e] uppercase">Automne — Hiver</p>
        <p class="mt-3 text-7xl leading-none text-[#e6cf9c] italic">2026</p>
        <span class="my-8 h-16 w-px bg-gradient-to-b from-transparent via-[#c9a96e] to-transparent"></span>
        <p class="text-lg leading-snug text-[#efe6d2]/80 italic">“Elegance is refusal.”</p>
        <p class="mt-3 text-[10px] tracking-[0.45em] text-[#c9a96e]/80 uppercase">Atelier Valois</p>
      </div>
    </div>

    <div class="mx-auto w-full max-w-sm text-center">
      <svg aria-hidden="true" viewBox="0 0 100 100" class="mx-auto size-20 text-[#c9a96e]">
        <circle cx="50" cy="50" r="47" fill="none" stroke="currentColor" stroke-width="0.8"/>
        <circle cx="50" cy="50" r="42" fill="none" stroke="currentColor" stroke-width="0.4"/>
        <path d="M50 3.5l1.6 3-1.6 3-1.6-3zM50 90.5l1.6 3-1.6 3-1.6-3z" fill="currentColor"/>
        <text x="50" y="61" text-anchor="middle" font-family="Cormorant Garamond, serif" font-size="32" font-style="italic" fill="currentColor" letter-spacing="-2">MV</text>
      </svg>
      <p class="mt-6 text-xl tracking-[0.4em] sm:text-2xl sm:tracking-[0.55em] text-[#e6cf9c] uppercase">Maison Valois</p>
      <p class="mt-2 text-[10px] tracking-[0.5em] text-[#c9a96e]/80 uppercase">Paris · Depuis MCMXXVIII</p>

      <div aria-hidden="true" class="mx-auto mt-6 flex max-w-[12rem] items-center gap-3 text-[#c9a96e]">
        <span class="h-px flex-1 bg-gradient-to-r from-transparent to-[#c9a96e]/70"></span>
        <svg viewBox="0 0 10 10" class="size-2"><path d="M5 0l1.2 3.8L10 5 6.2 6.2 5 10 3.8 6.2 0 5l3.8-1.2z" fill="currentColor"/></svg>
        <span class="h-px flex-1 bg-gradient-to-l from-transparent to-[#c9a96e]/70"></span>
      </div>

      <h1 class="mt-6 text-4xl italic">Welcome back</h1>
      <p class="mt-2 text-base text-[#efe6d2]/65">Sign in to your private client account.</p>

      <form data-auth-form class="mt-8 space-y-7 text-left">
        <div>
          <label for="maison-email" class="block text-[10px] font-semibold tracking-[0.4em] text-[#c9a96e] uppercase">Email address</label>
          <input id="maison-email" name="email" type="email" autocomplete="email" inputmode="email" required
            class="mt-2 block w-full border-0 border-b border-[#c9a96e]/35 bg-transparent px-0 py-2 text-xl tracking-wide text-[#efe6d2] outline-none transition focus:border-[#e6cf9c]" />
        </div>
        <div>
          <label for="maison-password" class="block text-[10px] font-semibold tracking-[0.4em] text-[#c9a96e] uppercase">Password</label>
          <input id="maison-password" name="password" type="password" autocomplete="current-password" required
            class="mt-2 block w-full border-0 border-b border-[#c9a96e]/35 bg-transparent px-0 py-2 text-xl tracking-[0.3em] text-[#efe6d2] outline-none transition focus:border-[#e6cf9c]" />
          <a href="#" class="mt-3 inline-block text-sm text-[#efe6d2]/60 italic underline decoration-[#c9a96e]/40 underline-offset-4 hover:text-[#e6cf9c] focus-visible:outline-1 focus-visible:outline-offset-4 focus-visible:outline-[#c9a96e]">Forgotten your password?</a>
        </div>

        <button type="submit" data-pending="One moment" data-done="Bienvenue"
          class="relative w-full border border-[#c9a96e] px-6 py-4 text-xs font-semibold tracking-[0.5em] text-[#e6cf9c] uppercase transition duration-500 hover:bg-[#c9a96e] hover:text-[#0a0908] focus-visible:outline-1 focus-visible:outline-offset-4 focus-visible:outline-[#c9a96e] disabled:cursor-wait disabled:opacity-70">
          <span data-label>Sign in</span>
        </button>
      </form>

      <p class="mt-8 text-[10px] tracking-[0.4em] text-[#c9a96e]/70 uppercase">New to the Maison?</p>
      <a href="#" class="mt-2 inline-block text-lg italic text-[#e6cf9c] underline decoration-[#c9a96e]/40 decoration-1 underline-offset-[6px] hover:decoration-[#e6cf9c] focus-visible:outline-1 focus-visible:outline-offset-4 focus-visible:outline-[#c9a96e]">Create your account</a>
    </div>
  </div>
</section>
